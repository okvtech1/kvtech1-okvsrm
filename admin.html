<!DOCTYPE html>
<html lang="en"><head><script>/* OKV static pages: connects the Apps Script templates to the Code.gs backend.
   1. google.script.run is replaced by a version that POSTs {rpc:1, fn, args} to the Apps Script web app.
   2. The web app address is pasted once on the page and kept in this browser (localStorage).
   3. Links that point at Apps Script pages (?page=pricing and so on) are changed to the matching static file. */
(function () {
  var KEY = 'okv_api_url';
  var FILES = { home: 'index.html', pricing: 'pricing.html', demo: 'demo.html', admin: 'admin.html', paid: 'paid.html',
                privacy: 'privacy.html', terms: 'terms.html', cookies: 'cookies.html', refund: 'refund.html', eula: 'eula.html' };

  function getUrl() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setUrl(u) { try { localStorage.setItem(KEY, u); } catch (e) { } }

  function callRpc(fn, args) {
    var url = getUrl();
    if (!url) return Promise.reject(new Error('This page is not connected to the server yet. Paste the web app address at the top of the page.'));
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ rpc: 1, fn: fn, args: args || [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || 'The server did not answer. Check the web app address.');
        return j.result;
      });
  }

  function makeRun(ok, bad) {
    var base = {
      withSuccessHandler: function (f) { return makeRun(f, bad); },
      withFailureHandler: function (f) { return makeRun(ok, f); }
    };
    return new Proxy(base, {
      get: function (t, prop) {
        if (prop in t) return t[prop];
        return function () {
          var args = [].slice.call(arguments);
          callRpc(String(prop), args).then(function (r) { if (ok) ok(r); },
                                           function (e) { if (bad) bad(e); else console.error(e); });
        };
      }
    });
  }
  window.google = window.google || {};
  window.google.script = { run: makeRun(null, null) };

  function fixLinks() {
    var as = document.querySelectorAll('a[href]');
    for (var i = 0; i < as.length; i++) {
      var h = as[i].getAttribute('href') || '';
      var m = /^\?page=([a-z]+)(.*)$/.exec(h);
      if (m && FILES[m[1]]) as[i].setAttribute('href', FILES[m[1]] + m[2]);
    }
  }

  function banner() {
    var box = document.createElement('div');
    box.id = 'okv-connect';
    box.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#16213e;color:#fff;font:14px/1.4 system-ui,sans-serif;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center');
    box.innerHTML = '<span style="flex:1 1 320px">Connect this page to the server: paste the Apps Script web app address (it ends in /exec).</span>' +
      '<input id="okv-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" style="flex:2 1 300px;padding:6px;border-radius:6px;border:0;color:#101828">' +
      '<button id="okv-save" type="button" style="padding:6px 14px;border-radius:6px;border:0;background:#e2b44f;color:#16213e;font-weight:700;cursor:pointer">Connect</button>' +
      '<span id="okv-msg" style="flex-basis:100%;color:#f3e3a6"></span>';
    document.body.appendChild(box);
    document.getElementById('okv-save').onclick = function () {
      var v = document.getElementById('okv-url').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(v)) {
        document.getElementById('okv-msg').textContent = 'That does not look like an Apps Script web app address. It starts with https://script.google.com/macros/s/ and ends in /exec.';
        return;
      }
      setUrl(v);
      location.reload();
    };
  }

  document.addEventListener('DOMContentLoaded', function () {
    fixLinks();
    if (!getUrl()) banner();
  });
})();
</script><meta charset="utf-8">

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:2000"><div id="toastBox" class="toast align-items-center text-bg-dark border-0"><div class="d-flex"><div class="toast-body" id="toastMsg"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
var BASE="", TOKEN='', S={view:'overview',page:1,q:'',status:'',sel:{},unread:0,known:null};
function run(fn){var a=[].slice.call(arguments,1);return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){var m=String((e&&e.message)||e).replace(/^Error:\s*/,'');if(m==='SESSION_EXPIRED'){logout(true);rej(new Error(''));return}rej(new Error(m))});r[fn].apply(r,a)})}
function A(fn){return run.apply(null,[fn,TOKEN].concat([].slice.call(arguments,1)))}
function toast(m){document.getElementById('toastMsg').textContent=m;bootstrap.Toast.getOrCreateInstance(document.getElementById('toastBox'),{delay:4500}).show()}
function fail(e){if(e&&e.message)toast(e.message)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function modal(title,body,foot){document.getElementById('gmT').textContent=title;document.getElementById('gmB').innerHTML=body;document.getElementById('gmF').innerHTML=foot||'<button class="btn btn-light" data-bs-dismiss="modal">Close</button>';bootstrap.Modal.getOrCreateInstance(document.getElementById('gm')).show()}
function closeM(){bootstrap.Modal.getOrCreateInstance(document.getElementById('gm')).hide()}
function v(id){return document.getElementById(id).value.trim()}
function phone(p){var d=String(p||'').replace(/[^0-9]/g,'');if(d.indexOf('234')===0)return d;if(d.charAt(0)==='0')return '234'+d.slice(1);return d}
function badge(s){var m={Pending:'warn',Approved:'ok',Rejected:'bad',Active:'ok','Code sent':'info','Pending activation':'warn',Trial:'info',Lead:'',New:'warn',Replied:'ok',Available:'ok',Sent:'info',Used:''};return '<span class="st '+(m[s]||'')+'">'+esc(s)+'</span>'}

/* ---------- auth ---------- */
function login(){var b=document.getElementById('lbtn'),e=document.getElementById('lerr');e.classList.add('d-none');b.disabled=true;
  run('adminLogin',document.getElementById('pw').value).then(function(r){TOKEN=r.token;document.getElementById('loginBox').classList.add('d-none');document.getElementById('app').classList.remove('d-none');document.getElementById('pw').value='';go('overview');setInterval(poll,45000)})
  .catch(function(x){e.textContent=x.message;e.classList.remove('d-none')}).finally(function(){b.disabled=false})}
function logout(expired){TOKEN='';document.getElementById('app').classList.add('d-none');document.getElementById('loginBox').classList.remove('d-none');if(expired)toast('Your session ended. Please sign in again.')}
function poll(){if(!TOKEN)return;A('adminOverview').then(function(o){if(S.known!==null&&o.unread>S.known)toast('New alert: '+(o.recentAlerts[0]?o.recentAlerts[0].Title:'check the dashboard'));S.known=o.unread;S.unread=o.unread;nav()}).catch(function(){})}

/* ---------- navigation ---------- */
var VIEWS=[['overview','Overview','bi-speedometer2'],['alerts','Alerts','bi-bell'],['activations','Activation requests','bi-key'],['payments','Payments','bi-credit-card'],['downloads','Downloads','bi-download'],['customers','Customers','bi-people'],['messages','Messages','bi-chat-dots'],['services','Installation requests','bi-tools'],['codes','Activation codes','bi-upc-scan'],['compose','Send messages','bi-send'],['installs','Trial installs','bi-pc-display'],['outbox','Sent log','bi-journal-text'],['integrations','Integrations','bi-plug'],['site','Pricing and site','bi-sliders'],['tools','Support tools','bi-life-preserver'],['settings','Settings','bi-gear']];
function nav(){document.getElementById('anav').innerHTML=VIEWS.map(function(x){return '<button class="btn '+(S.view===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><i class="bi '+x[2]+' me-1"></i>'+x[1]+(x[0]==='alerts'&&S.unread?'<span class="badge text-bg-danger">'+S.unread+'</span>':'')+'</button>'}).join('')}
function go(view,keep){S.view=view;if(!keep){S.page=1;S.q='';S.status=''}nav();document.getElementById('view').innerHTML='<div class="text-center p-5 text-secondary"><span class="spinner-border"></span></div>';R[view]().then(function(h){if(S.view===view)document.getElementById('view').innerHTML=h}).catch(function(e){fail(e);document.getElementById('view').innerHTML=''})}

/* ---------- generic list ---------- */
function toolbar(statuses,extra){return '<div class="d-flex flex-wrap gap-2 mb-3 align-items-center"><input class="form-control" style="max-width:260px" placeholder="Search..." value="'+esc(S.q)+'" onkeydown="if(event.key===\'Enter\'){S.q=this.value;S.page=1;go(S.view,true)}">'+(statuses?'<select class="form-select" style="max-width:200px" onchange="S.status=this.value;S.page=1;go(S.view,true)"><option value="">All statuses</option>'+statuses.map(function(s){return '<option '+(S.status===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select>':'')+(extra||'')+'</div>'}
function pager(r){var pages=Math.max(1,Math.ceil(r.total/r.size));return '<div class="d-flex justify-content-between align-items-center mt-2"><span class="small text-secondary">'+r.total+' record'+(r.total===1?'':'s')+'</span><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" '+(r.page<=1?'disabled':'')+' onclick="S.page--;go(S.view,true)">Prev</button><button class="btn btn-outline-secondary disabled">'+r.page+' / '+pages+'</button><button class="btn btn-outline-secondary" '+(r.page>=pages?'disabled':'')+' onclick="S.page++;go(S.view,true)">Next</button></div></div>'}

function contactBtns(r){var n=phone(r.Phone),msg='Hello '+(r.Name||'')+', this is OKV Technology Consults.';return '<a class="btn btn-sm btn-outline-secondary" title="Email" onclick="composeTo(\''+esc(r.Email)+'\')"><i class="bi bi-envelope"></i></a> '+(n?'<a class="btn btn-sm btn-outline-success" title="WhatsApp" target="_blank" rel="noopener" href="https://wa.me/'+n+'?text='+encodeURIComponent(msg)+'" onclick="A(\'adminLogContact\',\'WhatsApp\',\''+esc(r.Email)+'\',\'WhatsApp chat\').catch(function(){})"><i class="bi bi-whatsapp"></i></a> <a class="btn btn-sm btn-outline-secondary" title="Call" href="tel:+'+n+'"><i class="bi bi-telephone"></i></a> <a class="btn btn-sm btn-outline-secondary" title="SMS" href="sms:+'+n+'?body='+encodeURIComponent(msg)+'"><i class="bi bi-chat-text"></i></a>':'')}
var R={};
function ib(icon,title,on,cls){return '<button class="btn btn-sm btn-outline-'+(cls||'secondary')+' me-1" title="'+title+'" aria-label="'+title+'" onclick="'+on+'"><i class="bi bi-'+icon+'"></i></button>'}
var PAL=['#16213e','#b58a2c','#2f7d6d','#c4161c','#5b7db1','#8e6bbf','#d97a2b','#6b7280'];
function shortN(n){n=+n||0;var a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1)+'M':a>=1e3?(n/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'k':Math.round(n*10)/10+''}

function cBar(items,col){if(!items.length||items.every(function(i){return !i.v}))return '<div class="text-center text-secondary py-4">No data yet</div>';var W=420,H=170,l=34,t=12,b=34,max=Math.max.apply(null,items.map(function(i){return i.v}))*1.12||1,iw=W-l-8,ih=H-t-b,bw=iw/items.length,g='';for(var k=0;k<=4;k++){var y=t+ih-ih*k/4;g+='<line x1="'+l+'" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'" stroke="#e6e9f0"/><text x="'+(l-4)+'" y="'+(y+4)+'" font-size="10" fill="#667085" text-anchor="end">'+shortN(max*k/4)+'</text>'}items.forEach(function(it,i){var h=ih*it.v/max,x=l+i*bw+bw/2;g+='<rect x="'+(l+i*bw+bw*.18)+'" y="'+(t+ih-h)+'" width="'+bw*.64+'" height="'+h+'" rx="3" fill="'+(it.c||col||PAL[0])+'"><title>OKV Technology Admin</title></rect>';if(it.v)g+='<text x="'+x+'" y="'+(t+ih-h-3)+'" font-size="10" font-weight="600" text-anchor="middle">'+shortN(it.v)+'</text>';g+='<text x="'+x+'" y="'+(H-b+13)+'" font-size="9.5" fill="#667085" text-anchor="middle">'+esc(String(it.l).slice(0,9))+'</text>'});return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg>'}

async function recips(){
  var w=v('m_who'),all=await A('adminRecipients','');
  if(w==='custom')return v('m_custom').split(/[\s,;]+/).filter(Boolean).map(function(e){return{Email:e,Name:'',School:'',Phone:''}});

  var s=await A('adminGetSettings');
  return '<div class="panel"><h5 class="display-font">Pricing shown on the website and in the software</h5><div class="row g-3">'+textField('PRICE','Licence price (&#8358;, numbers only)',s)+textField('OLD_PRICE','Old price to cross out (optional)',s,'e.g. 150000')+textField('PROMO_TEXT','Promo text (optional)',s,'e.g. Launch offer until 31 December')+textField('INSTALL_NOTE','Installation service note / price',s,'Quoted on request')+'</div></div> <div class="panel"><h5 class="display-font">Download files (Google Drive file IDs)</h5><p class="small text-secondary">Upload each ZIP to Google Drive, share it as Anyone with the link, and paste the ID from the link. The Windows and Mac buttons across the site use these.</p><div class="row g-3">'+textField('DOWNLOAD_WIN_ID','Windows ZIP file ID (SchoolSystemSetup.exe)',s)+textField('DOWNLOAD_MAC_ID','Mac file ID (.dmg or ZIP)',s)+textField('DOWNLOAD_FILE_ID','Fallback file ID (used if one above is empty)',s)+'</div></div> <div class="panel"><h5 class="display-font">Payment methods</h5><div class="row g-3">'+sw('MANUAL_ENABLED','Accept manual bank transfer (shows bank details and the receipt form)',s)+sw('PAYSTACK_ENABLED','Accept Paystack online payment (set keys under Integrations)',s)+sw('AUTO_APPROVE','Auto-approve: email the activation code the moment a receipt is submitted',s)+'</div> <p class="small text-secondary mt-2 mb-2">Bank details for manual payments</p><div class="row g-3">'+textField('BANK_NAME','Bank name',s)+textField('ACCOUNT_NAME','Account name',s)+textField('ACCOUNT_NUMBER','Account number',s)+'</div> <div class="alert alert-warning small mt-3 mb-0">Auto-approve sends codes without you checking the receipt. Leave it off unless you trust the payment flow, and prefer Paystack verification, which cannot be faked.</div></div> <div class="panel"><h5 class="display-font">Landing page content</h5><div class="row g-3">'+areaField('HERO_TITLE','Main headline (empty uses the default)',s,2)+areaField('HERO_TEXT','Sub-headline',s,3)+areaField('ANNOUNCEMENT','Announcement banner shown on every page (empty hides it)',s,2)+'</div></div> <div class="panel"><h5 class="display-font">Website controls</h5><div class="row g-3">'+sw('MAINTENANCE','Maintenance mode (pauses all forms)',s)+sw('DOWNLOADS_ENABLED','Download form on',s)+sw('ACTIVATION_ENABLED','Activation and online payment forms on',s)+'</div></div> <div class="panel"><h5 class="display-font">Download package</h5><div class="row g-3">'+textField('DOWNLOAD_FILE_ID','Google Drive file ID of the installer ZIP (Share: anyone with the link)',s,'',8)+'<div class="col-md-4 d-flex align-items-end">'+(s.downloadLink?'<a class="btn btn-outline-secondary" target="_blank" rel="noopener" href="'+esc(s.downloadLink)+'">Test download link</a>':'<span class="st warn">not set</span>')+'</div></div></div> <button class="btn btn-navy" onclick="saveSite()">Save changes</button>';
};
function saveSite(){var f={};['PRICE','OLD_PRICE','PROMO_TEXT','INSTALL_NOTE','BANK_NAME','ACCOUNT_NAME','ACCOUNT_NUMBER','HERO_TITLE','HERO_TEXT','ANNOUNCEMENT','DOWNLOAD_FILE_ID','DOWNLOAD_WIN_ID','DOWNLOAD_MAC_ID'].forEach(function(k){f[k]=v('s_'+k)});['MANUAL_ENABLED','PAYSTACK_ENABLED','AUTO_APPROVE','MAINTENANCE','DOWNLOADS_ENABLED','ACTIVATION_ENABLED'].forEach(function(k){f[k]=document.getElementById('s_'+k).checked?'1':'0'});A('adminSaveSettings',f).then(function(){toast('Saved. The website is updated.');go('site',true)}).catch(fail)}

/* ---------- support tools ---------- */
R.tools=async function(){
  return '<div class="panel"><h5 class="display-font"><i class="bi bi-key me-2"></i>Administrator password reset code</h5><p class="small text-secondary">A school administrator who lost both the password and the recovery key sends you the Installation ID shown on the Forgot password window. Verify who they are first, then create a code. It works once, only on that installation, and expires in about 24 hours.</p><div class="row g-2" style="max-width:720px"><div class="col-md-5"><input class="form-control" id="t_iid" placeholder="XXXX-XXXX-XXXX-XXXX"></div><div class="col-md-5"><input class="form-control" id="t_email" placeholder="Email it to (optional)"></div><div class="col-md-2"><button class="btn btn-gold w-100" onclick="mkReset()">Create</button></div></div><div id="t_out" class="mt-3"></div></div> <div class="panel"><h5 class="display-font"><i class="bi bi-upc-scan me-2"></i>Re-activate after a reinstall</h5><p class="small text-secondary mb-0">Open Activation codes, find the school\'s code and press the reset icon. The code returns to the pool and can be sent again.</p></div>';
};
function mkReset(){A('adminResetToken',v('t_iid'),v('t_email')).then(function(r){document.getElementById('t_out').innerHTML='<div class="alert alert-success">Valid until '+esc(r.expires)+(r.emailed?'. Emailed.':'.')+'</div><textarea class="form-control code" id="t_code" rows="5" readonly onclick="this.select()">'+esc(r.code)+'</textarea><button class="btn btn-outline-secondary mt-2" onclick="copyCode(document.getElementById(\'t_code\').value)">Copy code</button>'}).catch(fail)}

/* ---------- settings ---------- */
R.settings=async function(){
  var s=await A('adminGetSettings');
  return '<div class="panel"><h5 class="display-font">Business</h5><div class="row g-3 mt-1">'+textField('OWNER_EMAIL','Email that receives alerts',s)+textField('SUPPORT_EMAIL','Support email shown to customers',s)+textField('WHATSAPP','WhatsApp number',s)+textField('SITE_NAME','Business name',s)+textField('WEBSITE','Website',s)+'</div><button class="btn btn-navy mt-3" onclick="saveBiz()">Save</button></div> <div class="panel"><h5 class="display-font">Status</h5><ul class="mb-0"><li>Signing key: '+(s.keySet?'<span class="st ok">set</span>':'<span class="st bad">missing, activation will fail</span>')+'</li><li>Download link: '+(s.downloadLink?'<a target="_blank" rel="noopener" href="'+esc(s.downloadLink)+'">test it</a>':'<span class="st warn">not set</span>')+'</li><li>Web app address (the installer\'s <code>config.json</code> <code>endpoint</code>):<br><code>'+esc(s.url)+'</code></li></ul></div> <div class="panel"><h5 class="display-font">Change dashboard password</h5><div class="row g-2" style="max-width:520px"><div class="col-6"><input type="password" class="form-control" id="pw_old" placeholder="Current password"></div><div class="col-6"><input type="password" class="form-control" id="pw_new" placeholder="New password (8+ characters)"></div></div><button class="btn btn-outline-dark mt-2" onclick="chPw()">Change password</button></div>';
};
function saveBiz(){var f={};['OWNER_EMAIL','SUPPORT_EMAIL','WHATSAPP','SITE_NAME','WEBSITE'].forEach(function(k){f[k]=v('s_'+k)});A('adminSaveSettings',f).then(function(){toast('Saved')}).catch(fail)}
function chPw(){A('adminChangePassword',v('pw_old'),v('pw_new')).then(function(){toast('Password changed');document.getElementById('pw_old').value='';document.getElementById('pw_new').value=''}).catch(fail)}
</script>
